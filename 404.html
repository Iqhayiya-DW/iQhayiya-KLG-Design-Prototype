  <script>

      var path = decodeURIComponent(location.pathname || "").toLowerCase();
      var dest = "";
      if (/index\.php/.test(path) && /about/.test(path)) dest = "/about.html";
      else if (/index\.php/.test(path) && /(contact|practice)/.test(path)) dest = "/practice.html";
      else if (/index\.php/.test(path) && /(project|portfolio|work|gallery)/.test(path)) dest = "/work.html";
      else if (/index\.php/.test(path) && /(news|blog|article)/.test(path)) dest = "/news.html";
      else if (/index\.php/.test(path) && /(join|career|vacanc)/.test(path)) dest = "/join.html";
      else if (/\/index\.php\/?$/.test(path)) dest = "/";
      else if (/\/about/.test(path)) dest = "/about.html";
      if (dest) location.replace(dest);
    })();
  </script>
