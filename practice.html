<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact — iQhayiya Design Workshop</title>
  <meta name="description" content="Contact iQhayiya Design Workshop in Manaba.">
  <link rel="icon" href="favicon.png?v=idw3" type="image/png" sizes="any">
  <link rel="icon" href="favicon.ico?v=idw3">
  <link rel="apple-touch-icon" href="favicon.png?v=idw3">
  <link rel="stylesheet" href="css/klg.css?v=klg32">
</head>
<body>
  <div id="site-header"></div>
  <main class="page-shell">
    <section class="contact-mast" id="contact">
      <h1>Contact us.</h1>
      <p class="contact-brand">iQhayiya Design Workshop</p>
      <p class="contact-lines">
        <a href="tel:+27393120403">(+27) 39 312 0403</a>
        <a href="mailto:adminkok@iqhayiyadw.co.za">adminkok@iqhayiyadw.co.za</a>
      </p>
      <p class="contact-lines">5 Darent Place, Manaba, KwaZulu-Natal, South Africa</p>
    </section>

    <section class="contact-panel">
      <div>
        <p class="eyebrow">Studio</p>
        <h2>Write to us.</h2>
        <p>5 Darent Place<br>Manaba, KwaZulu-Natal</p>
        <p><a href="tel:+27393120403">T +27 (0) 39 312 0403</a><br>
        <a href="https://wa.me/27737257297">WhatsApp 073 725 7297</a></p>
        <p><a href="https://www.instagram.com/iqhayiya_design_workshop_archi/" target="_blank" rel="noopener">Instagram</a><br>
        <a href="https://www.facebook.com/iQhayiya-Design-Workshop-Architects-254652624596384/" target="_blank" rel="noopener">Facebook</a><br>
        <a href="https://www.linkedin.com/company/iqhayiya-design-workshop" target="_blank" rel="noopener">LinkedIn</a></p>
        <div class="map-embed">
          <iframe title="iQhayiya Design Workshop on Google Maps" src="https://maps.google.com/maps?q=5%20Darent%20Place%20Manaba&amp;z=15&amp;output=embed" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
        </div>
      </div>
      <form id="contact-form" novalidate>
        <label>
          Name
          <input type="text" name="name" autocomplete="given-name">
          <span class="field-error" data-error-for="name"></span>
        </label>
        <label>
          Surname
          <input type="text" name="surname" autocomplete="family-name">
          <span class="field-error" data-error-for="surname"></span>
        </label>
        <label>
          Email
          <input type="email" name="email" autocomplete="email">
          <span class="field-error" data-error-for="email"></span>
        </label>
        <label>
          <span id="project-type-label">Subject</span>
          <select name="type" id="project-type" class="sr-only" tabindex="-1" aria-hidden="true">
            <option value="">Select</option>
            <option>Urban design</option>
            <option>Building supervision</option>
            <option>Residential</option>
            <option>Community Infrastructure</option>
          </select>
          <div class="custom-select" data-custom-select>
            <button type="button" class="custom-select-trigger" aria-haspopup="listbox" aria-expanded="false" aria-labelledby="project-type-label">
              Select
            </button>
            <ul class="custom-select-menu" role="listbox" hidden>
              <li role="option" data-value="Urban design">Urban design</li>
              <li role="option" data-value="Building supervision">Building supervision</li>
              <li role="option" data-value="Residential">Residential</li>
              <li role="option" data-value="Community Infrastructure">Community Infrastructure</li>
            </ul>
          </div>
          <span class="field-error" data-error-for="type"></span>
        </label>
        <label>
          Message
          <textarea name="note" rows="5"></textarea>
          <span class="field-error" data-error-for="note"></span>
        </label>
        <button type="submit">Send</button>
        <p class="form-status" id="form-status" role="status"></p>
      </form>
    </section>
  </main>
  <div id="site-footer"></div>
  <script type="module" src="js/practice.js?v=klg5"></script>
</body>
</html>
